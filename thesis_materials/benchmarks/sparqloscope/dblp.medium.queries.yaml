name: Sparqloscope DBLP (~525M triples)
description: Sparqloscope benchmark for DBLP computer science bibliography, data from https://dblp.org/rdf (01.09.2025), ~525 million triples. Sparqloscope at https://github.com/ad-freiburg/sparqloscope 
scale: 525000000
queries:
- name: join-2-small-large
  description: JOIN of a small and a large predicate
  query: |-
    SELECT (COUNT(*) AS ?count)
    WHERE {
      ?s dblp:formerStreamTitle ?o1 .
      ?s rdf:type ?o2 .
    }
- name: join-2-large-small
  description: JOIN of a large and a small predicate
  query: |-
    SELECT (COUNT(*) AS ?count)
    WHERE {
      ?s rdf:type ?o1 .
      ?s dblp:formerStreamTitle ?o2 .
    }
- name: join-2-large-large
  description: JOIN of two large predicates
  query: |-
    SELECT (COUNT(*) AS ?count)
    WHERE {
      ?s rdf:type ?o1 .
      ?s dblp:hasSignature ?o2 .
    }
- name: join-2-largest-result
  description: JOIN of two predicates with the largest possible result
  query: |-
    SELECT (COUNT(*) AS ?count)
    WHERE {
      ?s dblp:hasSignature ?o1 .
      ?s dblp:createdBy ?o2 .
    }
- name: join-2-large-large-with-large-result
  description: JOIN of two large predicates with a reasonably large result
  query: |-
    SELECT (COUNT(*) AS ?count)
    WHERE {
      ?s dblp:hasSignature ?o1 .
      ?s dblp:createdBy ?o2 .
    }
- name: join-2-large-large-with-small-result
  description: JOIN of two large predicates with a small result
  query: |-
    SELECT (COUNT(*) AS ?count)
    WHERE {
      ?s dblp:publishedAsPartOf ?o1 .
      ?s dblp:publishedInJournalVolume ?o2 .
    }
- name: join-3-star-largest-sum-of-join-sizes
  description: JOIN star of three large predicates with the largest sum of join sizes
  query: |-
    SELECT (COUNT(*) AS ?count)
    WHERE {
      ?s dblp:signatureOrdinal ?o1 .
      ?s rdf:type ?o2 .
      ?s dblp:signatureDblpName ?o3 .
    }
- name: join-3-chain-largest-sum-of-join-sizes
  description: JOIN chain of three large predicates with the largest sum of join sizes
  query: |-
    SELECT (COUNT(*) AS ?count)
    WHERE {
      ?a dblp:signaturePublication ?b .
      ?b rdf:type ?c .
      ?c rdfs:subClassOf ?d .
    }
- name: join-xlarge-star-on-small-predicates
  description: JOIN star of many small predicates
  query: |-
    SELECT (COUNT(*) AS ?count)
    WHERE {
      ?s dblp:formerStreamTitle ?o0 .
      ?s dblp:awardWebpage ?o1 .
      ?s dblp:successorStream ?o2 .
      ?s dblp:predeccessorStream ?o3 .
      ?s rdfs:comment ?o4 .
      ?s rdfs:domain ?o5 .
      ?s rdfs:range ?o6 .
      ?s rdfs:subPropertyOf ?o7 .
      ?s owl:equivalentProperty ?o8 .
      ?s rdfs:subClassOf ?o9 .
      ?s owl:equivalentClass ?o10 .
      ?s owl:inverseOf ?o11 .
      ?s dblp:publishersAddress ?o12 .
      ?s dblp:publishedInBookChapter ?o13 .
      ?s terms:creator ?o14 .
      ?s terms:abstract ?o15 .
      ?s terms:title ?o16 .
      ?s owl:priorVersion ?o17 .
      ?s owl:versionInfo ?o18 .
      ?s owl:versionIRI ?o19 .
      ?s terms:modified ?o20 .
      ?s terms:license ?o21 .
      ?s terms:description ?o22 .
    }
- name: join-xlarge-chain-on-small-predicates
  description: JOIN chain of many small predicates
  query: |-
    SELECT (COUNT(*) AS ?count)
    WHERE {
      ?v0 dblp:formerStreamTitle ?v1 .
      ?v1 dblp:awardWebpage ?v2 .
      ?v2 dblp:successorStream ?v3 .
      ?v3 dblp:predeccessorStream ?v4 .
      ?v4 rdfs:comment ?v5 .
      ?v5 rdfs:domain ?v6 .
      ?v6 rdfs:range ?v7 .
      ?v7 rdfs:subPropertyOf ?v8 .
      ?v8 owl:equivalentProperty ?v9 .
      ?v9 rdfs:subClassOf ?v10 .
      ?v10 owl:equivalentClass ?v11 .
      ?v11 owl:inverseOf ?v12 .
      ?v12 dblp:publishersAddress ?v13 .
      ?v13 dblp:publishedInBookChapter ?v14 .
      ?v14 terms:creator ?v15 .
      ?v15 terms:abstract ?v16 .
      ?v16 terms:title ?v17 .
      ?v17 owl:priorVersion ?v18 .
      ?v18 owl:versionInfo ?v19 .
      ?v19 owl:versionIRI ?v20 .
      ?v20 terms:modified ?v21 .
      ?v21 terms:license ?v22 .
      ?v22 terms:description ?v23 .
    }
- name: optional-join-small-large
  description: OPTIONAL JOIN of a small and a large predicate
  query: |-
    SELECT (COUNT(*) AS ?count)
    WHERE {
      ?s dblp:formerStreamTitle ?o1 .
